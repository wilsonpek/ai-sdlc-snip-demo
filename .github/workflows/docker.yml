# .github/workflows/docker.yml
# Builds the Docker image from bundle/ and pushes it to ghcr.io.
#
# Fires when the bundle SUBMODULE POINTER on main is updated — that path
# is a gitlink, so it changes exactly when a new bundle release is pinned —
# or when this file itself changes, or on manual dispatch.

name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - bundle                           # submodule pointer → fires per bundle release
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
